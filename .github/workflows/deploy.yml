name: Build & Deploy Flask App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
        REPO_NAME: ${{ secrets.ECR_REPOSITORY }}
      run: |
        docker build -t $ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG

    - name: SSH into EC2 and deploy container
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "Checking Docker group membership..."
          if ! groups $USER | grep -q '\bdocker\b'; then
            echo "Adding $USER to docker group..."
            sudo usermod -aG docker $USER
            echo "Please reboot EC2 manually once to apply docker group permissions for user."
          fi

          echo "Logging into Amazon ECR..."
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

          echo "Pulling latest image..."
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

          echo "Stopping and removing existing container..."
          docker stop flask-app || true
          docker rm flask-app || true

          echo "Starting new container on port 8082..."
          docker run -d --name flask-app -p 8082:8082 \
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

          echo "Deployment complete. Visit http://3.89.62.229:8082"

